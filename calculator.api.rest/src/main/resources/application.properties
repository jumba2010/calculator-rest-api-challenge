# AMQP listens on 5672 - 15672 is only the RabbitMQ management UI
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
server.port=8081
calculator.api.amqp.queue=calculator.queue
calculator.api.amqp.routing.key=calculator.key
calculator.api.amqp.exchange=calculator.direct
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web=INFO
logging.file=logs/spring-boot-logging.log
calculator.response.token=Response_Token
calculator.default.mdc.uuid.token=Slf4jMDCFilter.UUID
